<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI Sequence Design</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- KaTeX for Math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation. On desktop it starts hidden and slides in when
             the mouse reaches the left edge (the hot zone); see main.css. -->
        <div class="sidebar-hotzone" aria-hidden="true"></div>
        <nav class="sidebar">
            <div class="sidebar-header">
                <h1>MRI Design</h1>
            </div>
            <ul id="nav-list" class="nav-list">
                <!-- Navigation items injected by JS -->
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <div id="content-container" class="content-container glass-panel">
                <!-- Content injected by JS -->
                <div class="welcome-screen">
                    <h2>Welcome to MRI Design</h2>
                    <p>Loading the sequence walkthrough…</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Data -->
    <script src="js/data/videos.js"></script>
    <script src="js/data/learn.js"></script>
    <script src="js/data/walkthrough.js"></script>

    <!-- Pulseq code templates (order: names + system first, blocks before composer) -->
    <script src="js/data/templates/names.js"></script>
    <script src="js/data/templates/system.js"></script>
    <script src="js/data/templates/common.js"></script>
    <script src="js/data/templates/excitations.js"></script>
    <script src="js/data/templates/trajectories.js"></script>
    <script src="js/data/templates/matlab/common.js"></script>
    <script src="js/data/templates/matlab/excitations.js"></script>
    <script src="js/data/templates/matlab/trajectories.js"></script>
    <!-- Console protocols: registry first, then the .py templates, then the .m twins -->
    <script src="js/data/protocols.js"></script>
    <script src="js/data/templates/protocols.js"></script>
    <script src="js/data/templates/matlab/protocols.js"></script>
    <script src="js/data/templates/composer.js"></script>

    <!-- Logic -->
    <script src="js/downloads.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/simulator.js"></script>
    <script src="js/builder.js"></script>
    <script src="js/console.js"></script>
    <script src="js/learn.js"></script>
    <script src="js/walkthrough.js"></script>
    <script src="js/inspector.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
